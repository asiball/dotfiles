# tmux 設定(macOS / Linux / WSL2 共通、tmux 3.3 以上。allow-passthrough が 3.3 から)
# 置き場所は ~/.config/tmux/tmux.conf。~/.tmux.conf があるとそちらが優先されるので置かない。
# キー一覧: prefix + /  (チートシート)   prefix + ?  (全バインド)

# ===== 基本 =====
set -g prefix C-s                         # Claude Code 側の Ctrl+S(stash)は ~/.claude/keybindings.json で無効化
unbind C-b
bind C-s send-prefix                      # prefix を 2 回押すとアプリに Ctrl+S を送る
if-shell 'infocmp tmux-256color >/dev/null 2>&1' \
    'set -g default-terminal tmux-256color' \
    'set -g default-terminal screen-256color'
set -ga terminal-overrides ',xterm-256color:Tc'   # True Color
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g history-limit 50000
set -s escape-time 0
set -g focus-events on
set -g mouse on                           # クリックでペイン選択、境界ドラッグでリサイズ、ホイールでスクロール
bind r source-file ~/.config/tmux/tmux.conf \; display "Reloaded"

# ===== Claude Code 連携 (https://code.claude.com/docs/en/terminal-config) =====
set -g allow-passthrough on               # Shift+Enter 改行などの拡張キーを通す
set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -s set-clipboard on                   # OSC52 対応ターミナルではアプリから直接クリップボードへ

# ===== ペイン =====
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5
bind e setw synchronize-panes \; display "synchronize-panes #{?pane_synchronized,on,off}"
# z: 最大化トグル / x: 閉じる / q: 番号表示 / { }: 入れ替え は既定のまま

# ===== ウィンドウ =====
bind c new-window -c "#{pane_current_path}"
bind w choose-tree -Zw
# n / p / 数字 で移動は既定のまま

# ===== コピーモード (vi) =====
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y     send -X copy-pipe-and-cancel "~/.local/bin/clipcopy"
bind -T copy-mode-vi Enter send -X copy-pipe-and-cancel "~/.local/bin/clipcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "~/.local/bin/clipcopy"   # マウス選択でもコピー

# ===== ペイン枠に役割を表示(2 ペイン以上のとき) =====
set -g pane-border-format " #{pane_index}: #{pane_current_command}#{?#{@claude_status}, [#{@claude_status}],} "
set-hook -g window-layout-changed "if -F '#{==:#{window_panes},1}' 'set -w pane-border-status off' 'set -w pane-border-status top'"

# ===== Claude の状態を可視化 =====
# Claude Code hooks(~/.claude/hooks/tmux-claude-status)が @claude_status を working / waiting / done に更新する
# ウィンドウ名の後ろに 🤖 作業中 / 💬 入力待ち / ✅ 完了 を付ける
setw -g window-status-format " #I:#W#{?#{==:#{@claude_status},working}, 🤖,}#{?#{==:#{@claude_status},waiting}, 💬,}#{?#{==:#{@claude_status},done}, ✅,} "
setw -g window-status-current-format "#[fg=colour255,bg=colour27,bold] #I:#W#{?#{==:#{@claude_status},working}, 🤖,}#{?#{==:#{@claude_status},waiting}, 💬,}#{?#{==:#{@claude_status},done}, ✅,} #[default]"
# ベル(Claude Code: preferredNotifChannel=terminal_bell)が鳴ったウィンドウを強調(hooks が無い環境でも効く)
setw -g monitor-bell on
set -g bell-action any
set -g visual-bell on                     # 音の代わりに "Bell in window N" を表示
setw -g window-status-bell-style "fg=colour255,bg=colour166,bold"

# ===== チートシート =====
bind / display-popup -E -w 80% -h 90% 'less -R ~/.config/tmux/cheatsheet.md'

# ===== 見た目 =====
set -g status-position top
set -g status-interval 5
set -g status-style "bg=colour238,fg=colour255"
set -g status-justify centre
set -g status-left-length 30
set -g status-right-length 90
set -g status-left "#[bold][#S]#[default] #{?client_prefix,#[reverse] PREFIX #[default],}"
set -g status-right "C-s: |/- split  hjkl move  z zoom  d detach  / help  #[bold]%m/%d %H:%M"
set -g pane-border-style fg=colour240
set -g pane-active-border-style fg=colour27
set -g window-style 'fg=colour247,bg=colour236'        # 非アクティブペインは少し暗く
set -g window-active-style 'fg=colour255,bg=colour232'
